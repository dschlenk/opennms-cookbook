---
driver:
  name: dokken
  registry_username: <%= ENV['DOCKER_USER'] %>
  registry_password: <%= ENV['DOCKER_PASSWORD'] %>
  privileged: true
  chef_image: cincproject/cinc
  chef_version: 18
  pull_platform_image: true

transport:
  name: dokken

provisioner:
  name: dokken
  project_name: cinc
  download_url: https://omnitruck.cinc.sh/install.sh
  chef_binary: /opt/cinc/bin/cinc-client
  chef_license: accept-no-persist # until https://github.com/test-kitchen/test-kitchen/pull/1984
  log_level: <%= ENV['KITCHEN_LOG_LEVEL'] || 'info' %>
  chef_log_level: debug
  clean_dokken_sandbox: <%= ENV['CLEAN_DOCKEN_SANDBOX'] || 'true' %>
  attributes:
    opennms:
      conf:
        env:
          START_TIMEOUT: 60
      upgrade: true
      postgresql:
        user_vault: creds
    yum:
      opennms-stable-common:
        baseurl: <%= ENV['OPENNMS_STABLE_COMMON'] || 'http://yum.opennms.org/stable/common' %>
      opennms-stable-rhel9:
        baseurl: <%= ENV['OPENNMS_STABLE_RHEL9'] || 'http://yum.opennms.org/stable/rhel9' %>

verifier:
  name: inspec

platforms:
  - name: preinstalled-34-oraclelinux-9
    driver:
      image: c1og/opennms-34-oraclelinux-9
      privileged: true
      pid_one_command: /usr/lib/systemd/systemd
      volumes:
        - /sys/fs/cgroup:/sys/fs/cgroup:ro

  - name: preinstalled-oraclelinux-9
    driver:
      image: c1og/opennms-35-oraclelinux-9
      privileged: true
      pid_one_command: /usr/lib/systemd/systemd
      volumes:
        - /sys/fs/cgroup:/sys/fs/cgroup:ro

  # Intercepts and fakes service status calls on Oracle Linux 10
  - name: preinstalled-oraclelinux-10
    driver:
      image: c1og/opennms-35-oraclelinux-10
      pid_one_command: /bin/sh -c "while true; do sleep 3600; done"
    lifecycle:
      pre_converge:
        - remote: |
            bash -c 'echo -e "#!/bin/sh\nexit 0" > /usr/sbin/chkconfig && chmod +x /usr/sbin/chkconfig
            echo -e "#!/bin/sh\nexit 0" > /usr/sbin/service && chmod +x /usr/sbin/service
            echo -e "#!/bin/sh\nexit 0" > /usr/bin/systemctl && chmod +x /usr/bin/systemctl'

  - name: oraclelinux-9
    driver:
      image: dokken/oraclelinux-9
      privileged: true
      pid_one_command: /usr/lib/systemd/systemd
      volumes:
        - /sys/fs/cgroup:/sys/fs/cgroup:ro
    lifecycle:
      pre_converge:
        - remote: |
            bash -c 'declare i=0;
              declare wait=5;
              declare timeout=300;
              while true; do
                dnf -y install libxcrypt-compat hostname && break;
                if [ ${i} -ge ${timeout} ]; then
                  echo "Timed out after ${i}s waiting for dnf to complete";
                  exit 1;
                fi;
                echo "Waited ${i}/${timeout}s for dnf to complete, retrying in ${wait} seconds"
                sleep ${wait};
                let i+=${wait};
              done;'

  # Intercepts and fakes service status calls on Oracle Linux 10
  - name: oraclelinux-10
    driver:
      image: dokken/oraclelinux-10
      pid_one_command: /bin/sh -c "while true; do sleep 3600; done"
    lifecycle:
      pre_converge:
        - remote: |
            bash -c 'echo -e "#!/bin/sh\nexit 0" > /usr/sbin/chkconfig && chmod +x /usr/sbin/chkconfig
            echo -e "#!/bin/sh\nexit 0" > /usr/sbin/service && chmod +x /usr/sbin/service
            echo -e "#!/bin/sh\nexit 0" > /usr/bin/systemctl && chmod +x /usr/bin/systemctl'
        - remote: |
            bash -c 'declare i=0;
              declare wait=5;
              declare timeout=300;
              while true; do
                dnf -y install libxcrypt-compat hostname dmidecode iproute && break;
                if [ ${i} -ge ${timeout} ]; then
                  echo "Timed out after ${i}s waiting for dnf to complete";
                  exit 1;
                fi;
                echo "Waited ${i}/${timeout}s for dnf to complete, retrying in ${wait} seconds"
                sleep ${wait};
                let i+=${wait};
              done;'

suites:
  - name: recommended
    lifecycle:
      pre_converge:
        - remote: rm -f /opt/opennms/etc/scv.jce
    verifier:
      inspec_tests:
        - path: test/integration/default
        - path: test/integration/recommended
        - path: test/integration/user
    excludes:
      - preinstalled-34-oraclelinux-9
      - preinstalled-oraclelinux-9
      - preinstalled-oraclelinux-10
    attributes:
      opennms:
        rrdtool:
          enabled: true
        scv:
          vault: creds
        users:
          admin:
            vault: creds
        templates: true

  - name: kafka
    provisioner:
      policyfile: policyfiles/kafka.rb
    verifier:
      inspec_tests:
        - path: test/integration/default
        - path: test/integration/kafka
    excludes:
      - preinstalled-34-oraclelinux-9
      - preinstalled-oraclelinux-9
      - preinstalled-oraclelinux-10
    attributes:
      kafka:
        broker:
          zookeeper.connect: localhost:2181
          hostname: 127.0.0.1
        init_style: systemd
        version: 3.9.1
        checksum: ""
        sha512_checksum: 1ea204ba73411737a275429ca976d440f007ff0957b90b19be41dc5a4bae52617267769be9f0b5791714d0b3c4c760605bd426faea39edd90763585523fa2cfe
        scala_version: 2.13
        jvm_performance_opts: ""
        gc_log_opts: ""
        automatic_start: true
      opennms:
        kafka:
          producer:
            enabled: true
        rrdtool:
          enabled: true
        scv:
          vault: creds
        users:
          admin:
            vault: creds
        templates: true

  - name: upgrade
    verifier:
      inspec_tests:
        - path: test/integration/default
        - path: test/integration/upgrade
    excludes:
      - oraclelinux-9
      - oraclelinux-10
      - preinstalled-oraclelinux-9
      - preinstalled-oraclelinux-10

  - name: no_upgrade
    excludes:
      - oraclelinux-9
      - oraclelinux-10
      - preinstalled-oraclelinux-9
      - preinstalled-oraclelinux-10
    provisioner:
      policyfile: policyfiles/no_upgrade.rb
    verifier:
      inspec_tests:
        - path: test/integration/no_upgrade
    attributes:
      opennms:
        upgrade: false

  - name: default
    excludes:
      - preinstalled-34-oraclelinux-9
      - preinstalled-oraclelinux-9
      - preinstalled-oraclelinux-10

  - name: plugins
    excludes:
      - oraclelinux-9
      - oraclelinux-10
      - preinstalled-34-oraclelinux-9
    attributes:
      opennms:
        plugin:
          addl:
            - opennms-plugin-protocol-nsclient
            - opennms-plugin-provisioning-snmp-hardware-inventory
            - opennms-plugin-provisioning-snmp-asset
            - opennms-plugin-northbounder-jms

  - name: avail_category
    excludes:
      - oraclelinux-9
      - oraclelinux-10
      - preinstalled-34-oraclelinux-9
      - preinstalled-oraclelinux-9
    provisioner:
      policyfile: policyfiles/avail_category.rb
    verifier:
      inspec_tests:
        - path: test/integration/default
        - path: test/integration/avail_category

  - name: avail_view_section
    excludes:
      - oraclelinux-9
      - oraclelinux-10
      - preinstalled-34-oraclelinux-9
      - preinstalled-oraclelinux-9
    provisioner:
      policyfile: policyfiles/avail_view_section.rb
    verifier:
      inspec_tests:
        - path: test/integration/default
        - path: test/integration/avail_view_section

  - name: avail_view_section_mod
    excludes:
      - oraclelinux-9
      - oraclelinux-10
      - preinstalled-34-oraclelinux-9
      - preinstalled-oraclelinux-9
    provisioner:
      policyfile: policyfiles/avail_view_section_mod.rb
    verifier:
      inspec_tests:
        - path: test/integration/default
        - path: test/integration/avail_view_section_mod

  - name: collection_graph
    excludes:
      - oraclelinux-9
      - oraclelinux-10
      - preinstalled-34-oraclelinux-9
      - preinstalled-oraclelinux-9
    provisioner:
      policyfile: policyfiles/collection_graph.rb
    verifier:
      inspec_tests:
        - path: test/integration/default
        - path: test/integration/collection_graph

  - name: collection_graph_file
    excludes:
      - oraclelinux-9
      - oraclelinux-10
      - preinstalled-34-oraclelinux-9
      - preinstalled-oraclelinux-9
    provisioner:
      policyfile: policyfiles/collection_graph_file.rb
    verifier:
      inspec_tests:
        - path: test/integration/default
        - path: test/integration/collection_graph_file

  - name: collection_package
    excludes:
      - oraclelinux-9
      - oraclelinux-10
      - preinstalled-34-oraclelinux-9
      - preinstalled-oraclelinux-9
    provisioner:
      policyfile: policyfiles/collection_package.rb
    verifier:
      inspec_tests:
        - path: test/integration/default
        - path: test/integration/collection_package

  - name: collection_package_delete
    excludes:
      - oraclelinux-9
      - oraclelinux-10
      - preinstalled-34-oraclelinux-9
      - preinstalled-oraclelinux-9
    provisioner:
      policyfile: policyfiles/collection_package_delete.rb
    verifier:
      inspec_tests:
        - path: test/integration/default
        - path: test/integration/collection_package_delete

  - name: collection_package_update
    excludes:
      - oraclelinux-9
      - oraclelinux-10
      - preinstalled-34-oraclelinux-9
      - preinstalled-oraclelinux-9
    provisioner:
      policyfile: policyfiles/collection_package_update.rb
    verifier:
      inspec_tests:
        - path: test/integration/default
        - path: test/integration/collection_package_update

