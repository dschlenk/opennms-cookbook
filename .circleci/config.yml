version: 2.1

jobs:
  style:
    docker:
      - image: cincproject/workstation:25.13.7
        auth:
          username: $DOCKER_USER
          password: $DOCKER_PASSWORD
    steps:
      - checkout
      - run:
          name: bundler
          command: cinc exec bundle install
      - run:
          name: mdl
          command: cinc exec mdl documentation/*.md
      - run:
          name: cookstyle
          command: cookstyle

  integration:
    machine:
      image: ubuntu-2404:current
    resource_class: large  # Upgrades memory to 8GB RAM to fix the OpenNMS Java OOM crash
    parallelism: 30
    steps:
      - checkout
      - run:
          name: docker login
          command: |
            echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USER" --password-stdin
      - run:
          name: install cinc workstation
          command: |
            # Pointing back to the valid omnitruck script installer address
            curl -L https://cinc.sh | sudo bash -s -- -P cinc-workstation -v 25.13.7
            # Persist Cinc environment variables across all subsequent CircleCI steps
            echo 'eval "$(cinc shell-init bash)"' >> $BASH_ENV
      - run:
          name: bundler
          command: bundle install --prefer-local
      - run:
          name: kitchen
          command: |
            export DOCKER_USER DOCKER_PASSWORD

            # Run kitchen test with '-d never' so it skips automatic cleanup on crash.
            # If it fails, capture the active process outputs before exiting.
            if ! kitchen list -b | circleci tests split | xargs -L 1 kitchen test -d never; then
              echo "=================================================="
              echo "TEST KITCHEN FAILED! DUMPING CONTAINER LOGS:"
              echo "=================================================="
            
              # Grab the ID of the most recently generated container box
              LAST_CONTAINER=$(docker ps -a -q -n 1)
            
              # Print the output to the console window
              docker logs "$LAST_CONTAINER"
              exit 1
            fi

workflows:
  version: 2
  untagged-build:
    jobs:
      - style
      - integration
