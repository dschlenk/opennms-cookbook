# frozen_string_literal: true

version: 2.1

executors:
  cinc-workstation-executor:
    docker:
      - image: cincproject/workstation:25.13.7
        auth:
          username: $DOCKER_USER
          password: $DOCKER_PASSWORD
    working_directory: ~/cookbook

jobs:
  style:
    executor: cinc-workstation-executor
    steps:
      - checkout
      - run:
          name: Run Bundler Dependency Install
          command: cinc exec bundle install
      - run:
          name: Run Markdown Lint Checks
          command: cinc exec mdl documentation/*.md
      - run:
          name: Run Cookstyle Code Cleaners
          command: cookstyle

  unit:
    executor: cinc-workstation-executor
    steps:
      - checkout
      - run:
          name: Run Bundler Dependency Install
          command: cinc exec bundle install
      - run:
          name: Run ChefSpec Unit Tests (Oracle Linux 9 & 10 Matrix)
          # Uses recursive glob pattern matching to sweep up libraries, resources,
          # and recipe specs cleanly into the Cinc exec thread environment.
          command: cinc exec rspec spec/**/*_spec.rb

  integration:
    machine:
      image: ubuntu-2404:current
    # Upgrades execution frame memory allocation to 8GB RAM to mitigate
    # persistent OpenNMS Java runtime heap space crash regressions.
    resource_class: large
    parallelism: 30
    working_directory: ~/cookbook
    steps:
      - checkout
      - run:
          name: Authenticate against Docker Hub registry
          command: |
            # Prevent 15s IPv6 routing hangs on Ubuntu 24.04 VMs
            sudo sysctl -w net.ipv6.conf.all.disable_ipv6=1
            sudo sysctl -w net.ipv6.conf.default.disable_ipv6=1

            # Stagger the 30 parallel containers (0-10s) to avoid simultaneous auth throttling
            sleep $((RANDOM % 10))

            # Retry login up to 5 times with backoff
            for i in {1..5}; do
              echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USER" --password-stdin && exit 0
              echo "Docker login attempt $i failed, retrying in 5s..."
              sleep 5
            done
            exit 1
      - run:
          name: Install Cinc Workstation Omnibus Packages
          command: |
            curl -L https://omnitruck.cinc.sh/install.sh | sudo bash -s -- -P cinc-workstation -v 25.13.7
            # Persist Cinc environment variables across all subsequent CircleCI steps
            echo 'eval "$(cinc shell-init bash)"' >> $BASH_ENV
      - run:
          name: Run Bundler Local Dependency Cache
          command: bundle install --prefer-local
      - run:
          name: Execute Test Kitchen Integration Matrix
          no_output_timeout: 25m
          command: |
            export DOCKER_USER DOCKER_PASSWORD
            
            # Destroy passing suites immediately to free RAM/disk; keep failed containers for log inspection
            for suite in $(kitchen list -b | circleci tests split); do
              echo "=================================================="
              echo "RUNNING SUITE: ${suite}"
              echo "=================================================="
            
              if ! timeout -k 1m 20m kitchen test -d passing "${suite}"; then
                echo "=================================================="
                echo "TEST KITCHEN FAILED OR TIMED OUT ON: ${suite}"
                echo "DUMPING CONTAINER LOGS:"
                echo "=================================================="
            
                LAST_CONTAINER=$(docker ps -a -q -n 1)
                if [ -n "$LAST_CONTAINER" ]; then
                  docker logs "$LAST_CONTAINER" || true
                  docker exec "$LAST_CONTAINER" cat /opt/opennms/logs/output.log 2>/dev/null || true
                fi
                exit 1
              fi
            done
            
            echo "=================================================="
            echo "TEST KITCHEN SUCCEEDED! ALL INTEGRATION CHECKS PASSED"
            echo "=================================================="
workflows:
  version: 2
  validate_cookbook:
    jobs:
      - style
      - unit
      - integration:
          requires:
            - unit
