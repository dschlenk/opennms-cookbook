version: 2.1

jobs:
  style:
    docker:
      - image: cincproject/workstation:25.13.7
        auth:
          username: $DOCKER_USER
          password: $DOCKER_PASSWORD
    steps:
      - checkout
      - run:
          name: bundler
          command: cinc exec bundle install
      - run:
          name: mdl
          command: cinc exec mdl documentation/*.md
      - run:
          name: cookstyle
          command: cookstyle
  integration:
    machine:
      image: ubuntu-2404:current
    parallelism: 30
    steps:
      - checkout
      - run:
          name: docker login
          # Replaced "-p" with "--password-stdin" pipeline to bypass interactive hangs
          command: |
            echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USER" --password-stdin
      - run:
          name: install cinc workstation
          command: curl -L https://omnitruck.cinc.sh/install.sh | sudo bash -s -- -P cinc-workstation -v 25.13.7
      - run:
          name: cinc
          command: cinc shell-init bash
      - run:
          name: bundler
          command: cinc exec bundle install --prefer-local
      # Injects the dynamic JSON credential file that kitchen.yml expects to see
      - run:
          name: generate kitchen-dokken registry credentials
          command: |
            echo "{\"username\": \"${DOCKER_USER}\", \"password\": \"${DOCKER_PASSWORD}\"}" > ./.kitchen_creds.json
      - run:
          name: kitchen
          command: kitchen list -b | circleci tests run --command="xargs -L 1 kitchen test -d always" --verbose
workflows:
  version: 2
  untagged-build:
    jobs:
      - style
      - integration
